<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2633"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#e9a21f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- lens -->
  <circle cx="226" cy="222" r="104" fill="#0d1117" stroke="url(#gold)" stroke-width="30"/>
  <!-- handle -->
  <line x1="304" y1="300" x2="384" y2="380" stroke="url(#gold)" stroke-width="40" stroke-linecap="round"/>
  <!-- up-trend arrow inside lens -->
  <polyline points="160,262 204,214 236,240 290,180" fill="none" stroke="#2ecc71" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="256,176 294,176 294,214" fill="none" stroke="#2ecc71" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
