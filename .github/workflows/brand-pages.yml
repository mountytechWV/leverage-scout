name: Build brand pages

# Rebuilds the Kingdom Traders (kt/) and LE Trading Academy (le/) pages
# from index.html whenever index.html or the brand files change.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/build_brands.py"
      - "brands/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build kt/ and le/
        run: python scripts/build_brands.py

      - name: Commit brand pages
        run: |
          git config user.name "leverage-scout-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kt le
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Rebuild brand pages"
            git pull --rebase
            git push
          fi
